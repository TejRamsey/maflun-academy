<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Results — Maflun Academy</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app" class="app">
  <div class="appbar" id="appbar"></div>
  <div class="app-layout">
    <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div>
    <aside class="sidebar" id="appSidebar"></aside>
    <main class="main">
        <div class="page-title"><div><h1>Results</h1><p>Enter and publish student scores for each term.</p></div></div>
        <div class="panel">
          <h3>Enter / edit results</h3>
          <div id="resultAlert"></div>
          <div class="field">
            <label>Find student</label>
            <input id="resStudentSearch" type="text" placeholder="Search by name or Student ID…" oninput="populateResultStudentSelect()">
          </div>
          <div class="field-row">
            <div class="field">
              <label>Student</label>
              <select id="resStudent" onchange="loadResultForm()"></select>
            </div>
            <div class="field">
              <label>Session</label>
              <input id="resSessionInput" type="text" placeholder="e.g. 2025/2026" value="2025/2026" onchange="loadResultForm()">
            </div>
          </div>
          <div class="field">
            <label>Term</label>
            <select id="resTermInput" onchange="loadResultForm()">
              <option>First Term</option>
              <option>Second Term</option>
              <option>Third Term</option>
            </select>
          </div>

          <div class="field">
            <label>Subjects</label>
            <div id="subjectRows" class="subject-rows"></div>
            <button class="btn-ghost" onclick="addSubjectRow()">+ Add subject</button>
          </div>

          <div class="field">
            <label>Teacher's remarks</label>
            <textarea id="resRemarks" rows="3" placeholder="Overall comment on the pupil's performance"></textarea>
          </div>

          <button class="btn btn-gold" onclick="saveResult()">Save result</button>
        </div>

        <div class="panel">
          <h3>Result history</h3>
          <p class="hint">Every term saved for the selected student, kept on record — nothing is overwritten between terms.</p>
          <div id="resultHistory"></div>
        </div>
      
    </main>
  </div>
</div>

<div id="idleBanner" class="idle-banner">
  <p id="idleBannerText">You'll be logged out soon due to inactivity.</p>
  <button onclick="stayLoggedIn()">Stay logged in</button>
</div>
<div id="toast" class="toast hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://js.paystack.co/v1/inline.js"></script>
<script src="app.js"></script>
<script>
(async function(){
  const record = await requireStaffAuth('results');
  if(!record) return; // not signed in — already redirected to login
  populateResultStudentSelect();
})();
</script>
</body>
</html>
