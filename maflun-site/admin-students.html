<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Students — Maflun Academy</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app" class="app">
  <div class="appbar" id="appbar"></div>
  <div class="app-layout">
    <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div>
    <aside class="sidebar" id="appSidebar"></aside>
    <main class="main">
        <div class="page-title"><div><h1>Students</h1><p>Register pupils and manage records.</p></div></div>
        <div class="panel">
          <h3>Register a student</h3>
          <p class="hint">Creates the Student ID and PIN the parent will use to log in to the portal.</p>
          <div id="studentAlert"></div>
          <div class="field-row">
            <div class="field">
              <label>Full name</label>
              <input id="stuName" type="text" placeholder="e.g. Amina Bello">
            </div>
            <div class="field">
              <label>Class</label>
              <select id="stuClass">
                <optgroup label="Nursery">
                  <option>Nursery 1</option><option>Nursery 2</option>
                </optgroup>
                <optgroup label="Primary">
                  <option>Primary 1</option><option>Primary 2</option><option>Primary 3</option>
                  <option>Primary 4</option><option>Primary 5</option><option>Primary 6</option>
                </optgroup>
                <optgroup label="Secondary">
                  <option>JSS 1</option><option>JSS 2</option><option>JSS 3</option>
                  <option>SSS 1</option><option>SSS 2</option><option>SSS 3</option>
                </optgroup>
              </select>
            </div>
          </div>
          <div class="field-row">
            <div class="field">
              <label>Parent / guardian phone</label>
              <input id="stuPhone" type="text" placeholder="e.g. 0803 000 0000">
            </div>
            <div class="field">
              <label>Portal PIN (4–6 digits)</label>
              <input id="stuPin" type="text" placeholder="e.g. 1234">
            </div>
          </div>
          <button class="btn btn-gold" onclick="registerStudent()">Register student</button>
        </div>

        <div class="panel">
          <h3>All students</h3>
          <p class="hint">Grouped by class. Search by name or Student ID.</p>
          <div class="field" style="max-width:360px">
            <input id="studentSearch" type="text" placeholder="Search students…" oninput="renderStudentsList()">
          </div>
          <div id="studentsList"></div>
        </div>
      
    </main>
  </div>
</div>

<div id="idleBanner" class="idle-banner">
  <p id="idleBannerText">You'll be logged out soon due to inactivity.</p>
  <button onclick="stayLoggedIn()">Stay logged in</button>
</div>
<div id="toast" class="toast hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://js.paystack.co/v1/inline.js"></script>
<script src="app.js"></script>
<script>
(async function(){
  const record = await requireStaffAuth('students');
  if(!record) return; // not signed in — already redirected to login
  renderStudentsList();
})();
</script>
</body>
</html>
