<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal Login — Maflun Academy</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .login-page{ min-height:100vh; display:grid; place-items:center; background:var(--paper); padding:20px; }
  .login-page .modal{ box-shadow:0 30px 100px rgba(32,27,61,.15); border:1px solid var(--line); }
  .back-home{ position:fixed; top:20px; left:20px; font-size:14px; color:var(--ink-soft); text-decoration:none; display:flex; align-items:center; gap:6px; }
  .back-home:hover{ color:var(--ink); }
</style>
</head>
<body>

<a class="back-home" href="index.html">← Back to school website</a>

<div class="login-page">
  <div class="modal" style="position:static;">
    <div class="eyebrow">Maflun Academy</div>
    <h2>Portal login</h2>
    <p style="color:var(--ink-soft);font-size:13px">Sign in to continue to your school account.</p>
    <div class="role-tabs">
      <button id="loginRoleStudent" onclick="setLoginRole('student')">Student / Parent</button>
      <button id="loginRoleStaff" onclick="setLoginRole('staff')">Staff</button>
    </div>

    <div id="studentLoginForm">
      <div id="portalLoginAlert"></div>
      <div class="field">
        <label for="portalId">Student ID</label>
        <input id="portalId" type="text" placeholder="e.g. MAF-0001" autocomplete="off">
      </div>
      <div class="field">
        <label for="portalPin">PIN</label>
        <input id="portalPin" type="password" placeholder="4–6 digit PIN" autocomplete="off">
      </div>
      <button class="btn btn-primary" style="width:100%" onclick="portalLogin()">Sign in</button>
      <p class="form-note">New here? The school office creates every Student ID and PIN during registration.</p>
    </div>

    <div id="staffLoginForm" class="hidden">
      <div id="adminLoginAlert"></div>
      <div class="field">
        <label for="adminEmail">Email</label>
        <input id="adminEmail" type="email" placeholder="you@maflunacademy.com" autocomplete="username">
      </div>
      <div class="field">
        <label for="adminPassword">Password</label>
        <input id="adminPassword" type="password" placeholder="Password" autocomplete="current-password">
      </div>
      <button class="btn btn-primary" style="width:100%" onclick="adminLogin()">Sign in</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="app.js"></script>
<script>
(async function(){
  const params = new URLSearchParams(location.search);
  setLoginRole(params.get('role') === 'staff' ? 'staff' : 'student');

  if(sessionStorage.getItem('maflunLogoutReason') === 'idle'){
    sessionStorage.removeItem('maflunLogoutReason');
    const msg = '<div class="alert alert-error">You were logged out due to inactivity, to keep this device safe.</div>';
    document.getElementById('portalLoginAlert').innerHTML = msg;
    document.getElementById('adminLoginAlert').innerHTML = msg;
    toast('Signed out due to inactivity');
  }

  // Already signed in this tab? Skip straight to the right dashboard.
  const { data: sessionData } = await supabaseClient.auth.getSession();
  if(sessionData && sessionData.session){
    const uid = sessionData.session.user.id;
    const { data: srow } = await supabaseClient.from('students').select('student_id').eq('auth_user_id', uid).maybeSingle();
    if(srow){ window.location.href = 'student-dashboard.html'; return; }
    const { data: staffRow } = await supabaseClient.from('staff').select('user_id').eq('user_id', uid).maybeSingle();
    if(staffRow){ window.location.href = 'admin-dashboard.html'; return; }
  }
})();
</script>
</body>
</html>
